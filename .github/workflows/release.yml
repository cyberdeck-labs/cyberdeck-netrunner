# Baut Linux-AppImage + Windows-Installer und veroeffentlicht sie als GitHub-Release.
# Die App holt sich Updates von dort (electron-updater).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Wird vom Chromium-Update direkt aufgerufen (Tags von GITHUB_TOKEN loesen sonst nichts aus)
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Windows Installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
